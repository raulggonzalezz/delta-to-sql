postgres:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  database: ${POSTGRES_DATABASE}
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  sslmode: ${POSTGRES_SSLMODE}

replication:
  publication_strategy: drop_create
  versioning:
    enabled: true
    retention:
      keep_previous_versions: true
      max_versions: 3
  performance:
    partitions: 8

logging:
  level: INFO
