apiVersion: batch/v1
kind: Job
metadata:
  name: delta-to-sql-run
  namespace: ed-isdf
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: delta-to-sql-run
    spec:
      serviceAccountName: working
      restartPolicy: Never
      containers:
        - name: submit
          image: mi-delta-to-sql:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["spark-submit"]
          args:
            - --master
            - k8s://https://kubernetes.default.svc:443
            - --deploy-mode
            - cluster
            - --name
            - delta-to-sql
            - --conf
            - spark.kubernetes.namespace=ed-isdf
            - --conf
            - spark.kubernetes.container.image=mi-delta-to-sql:0.1.3
            - --conf
            - spark.kubernetes.container.image.pullPolicy=IfNotPresent
            - --conf
            - spark.kubernetes.authenticate.driver.serviceAccountName=working
            - --conf
            - spark.kubernetes.driver.secretKeyRef.AWS_ACCESS_KEY_ID=lakehouse-s3:AWS_ACCESS_KEY_ID
            - --conf
            - spark.kubernetes.driver.secretKeyRef.AWS_SECRET_ACCESS_KEY=lakehouse-s3:AWS_SECRET_ACCESS_KEY
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_HOST=postgres-isdf:POSTGRES_HOST
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_PORT=postgres-isdf:POSTGRES_PORT
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_DATABASE=postgres-isdf:POSTGRES_DATABASE
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_USER=postgres-isdf:POSTGRES_USER
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_PASSWORD=postgres-isdf:POSTGRES_PASSWORD
            - --conf
            - spark.kubernetes.driver.secretKeyRef.POSTGRES_SSLMODE=postgres-isdf:POSTGRES_SSLMODE
            - --conf
            - spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID=lakehouse-s3:AWS_ACCESS_KEY_ID
            - --conf
            - spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY=lakehouse-s3:AWS_SECRET_ACCESS_KEY
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_HOST=postgres-isdf:POSTGRES_HOST
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_PORT=postgres-isdf:POSTGRES_PORT
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_DATABASE=postgres-isdf:POSTGRES_DATABASE
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_USER=postgres-isdf:POSTGRES_USER
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_PASSWORD=postgres-isdf:POSTGRES_PASSWORD
            - --conf
            - spark.kubernetes.executor.secretKeyRef.POSTGRES_SSLMODE=postgres-isdf:POSTGRES_SSLMODE
            - --conf
            - spark.hadoop.fs.s3a.endpoint=http://seaweedfs-s3.seaweedfs.svc.cluster.local:8333
            - --conf
            - spark.hadoop.fs.s3a.path.style.access=true
            - --conf
            - spark.hadoop.fs.s3a.connection.ssl.enabled=false
            - --conf
            - spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider
            - --conf
            - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
            - --conf
            - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
            - --conf
            - spark.executor.instances=1
            - --conf
            - spark.executor.cores=1
            - --conf
            - spark.executor.memory=512m
            - --conf
            - spark.driver.memory=1g
            - local:///opt/delta-to-sql/app/main.py
            - --source
            - s3a://lakehouse/projects/ed-isdf/bronze/clientes
            - --target-schema
            - public
            - --target-table
            - clientes
            - --config
            - /opt/delta-to-sql/config/config.yaml
            - --publication-strategy
            - table_swap
